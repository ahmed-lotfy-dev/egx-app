services:
  db:
    image: postgres:18-alpine
    container_name: egx-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: egx
      POSTGRES_PASSWORD: egx
      POSTGRES_DB: egx
    ports:
      - "5433:5432"
    volumes:
      - egx_pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U egx -d egx"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  egx_pgdata:
