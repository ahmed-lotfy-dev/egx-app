name: Deploy EGX Worker

on:
  push:
    branches: [main, feat/**]
    paths:
      - 'apps/worker/**'
      - 'apps/api/**'
      - 'packages/**'
      - '.github/workflows/deploy-worker.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/egx-worker

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/worker/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to OCI micro
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          command_timeout: 45m
          script: |
            # A failed/aborted run can leave orphaned pulls that thrash this
            # small box; clear them before starting a fresh one.
            pkill -f 'docker pull' 2>/dev/null || true
            sleep 2
            docker pull ghcr.io/ahmed-lotfy-dev/egx-worker:latest
            docker tag ghcr.io/ahmed-lotfy-dev/egx-worker:latest egx-worker:latest
            # Drop any leftover container (compose can leave a `<hash>_egx-worker`
            # that makes the next `up` fail with a name conflict).
            docker rm -f $(docker ps -aq -f name=egx-worker) 2>/dev/null || true
            cd ~/apps/egx-api && docker compose up -d --remove-orphans egx-worker
