name: Build and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push API
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/egx-api:latest
            ghcr.io/${{ github.repository_owner }}/egx-api:${{ github.sha }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Build and push Worker
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/worker/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/egx-worker:latest
            ghcr.io/${{ github.repository_owner }}/egx-worker:${{ github.sha }}
          cache-from: type=gha,scope=worker
          cache-to: type=gha,mode=max,scope=worker

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: read
    steps:
      - name: Pull and restart on VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          # The VPS is a small shared box; pulling and extracting layers can
          # take several minutes when it is busy.
          command_timeout: 30m
          script: |
            set -e
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
            cd /home/ubuntu/apps/egx-api

            # Registry pulls occasionally hit transient TLS timeouts, and this
            # box is small and shared, so retry and deploy the API first
            # instead of blocking it behind the larger worker image.
            pull() {
              ok=0
              for i in 1 2 3 4 5; do
                if docker compose pull "$1"; then ok=1; break; fi
                echo "pull of $1 failed, retrying ($i/5)"
                sleep 15
              done
              if [ "$ok" -ne 1 ]; then
                echo "could not pull $1 after 5 attempts"
                exit 1
              fi
            }

            pull egx-api
            docker compose up -d egx-api

            pull egx-worker
            docker compose up -d egx-worker

            # Pruning walks every layer on disk, which can take many minutes on
            # this box. Run it detached so a slow prune never fails a deploy
            # that already succeeded.
            nohup docker image prune -f >/tmp/prune.log 2>&1 &
            echo "deploy complete"
